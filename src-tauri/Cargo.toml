[package]
name = "postgres-ui"
version = "0.1.0"
description = "A focused desktop PostgreSQL browser"
authors = ["Postgres UI contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "postgres_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
thiserror = "2"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
